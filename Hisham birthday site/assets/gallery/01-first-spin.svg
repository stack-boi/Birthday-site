<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title">
  <title id="title">A vinyl record spinning on a warm turntable</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8eddd"/>
      <stop offset=".5" stop-color="#f2c6a0"/>
      <stop offset="1" stop-color="#eeb6ab"/>
    </linearGradient>
    <radialGradient id="glow" cx=".28" cy=".2" r=".6">
      <stop offset="0" stop-color="#fff8e8" stop-opacity=".95"/>
      <stop offset="1" stop-color="#f0d59c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d4c31"/>
      <stop offset="1" stop-color="#4a2a1e"/>
    </linearGradient>
    <radialGradient id="disc" cx=".36" cy=".28" r=".85">
      <stop offset="0" stop-color="#332821"/>
      <stop offset=".55" stop-color="#171310"/>
      <stop offset="1" stop-color="#0b0907"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .16"/></feComponentTransfer>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#3b251c" flood-opacity=".38"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>
  <circle cx="290" cy="220" r="380" fill="url(#glow)"/>
  <rect x="62" y="752" width="876" height="138" rx="20" fill="url(#deck)" filter="url(#shadow)"/>
  <rect x="62" y="752" width="876" height="12" rx="6" fill="#f2c6a0" opacity=".55"/>
  <circle cx="110" cy="822" r="9" fill="#f0d59c"/>
  <circle cx="142" cy="822" r="9" fill="#c8683b"/>

  <g filter="url(#shadow)">
    <circle cx="500" cy="500" r="330" fill="url(#disc)"/>
    <g fill="none" stroke="#4f4038" stroke-opacity=".6">
      <circle cx="500" cy="500" r="314"/>
      <circle cx="500" cy="500" r="292"/>
      <circle cx="500" cy="500" r="270"/>
      <circle cx="500" cy="500" r="248"/>
      <circle cx="500" cy="500" r="226"/>
      <circle cx="500" cy="500" r="204"/>
      <circle cx="500" cy="500" r="182"/>
      <circle cx="500" cy="500" r="160"/>
    </g>
    <g fill="none" stroke="#f8eddd" stroke-opacity=".1">
      <circle cx="500" cy="500" r="304"/>
      <circle cx="500" cy="500" r="260"/>
      <circle cx="500" cy="500" r="216"/>
      <circle cx="500" cy="500" r="172"/>
    </g>
    <path d="M690 300a330 330 0 0 1 125 180" fill="none" stroke="#f8eddd" stroke-opacity=".22" stroke-width="34" stroke-linecap="round"/>
    <circle cx="500" cy="500" r="118" fill="#f2c6a0"/>
    <circle cx="500" cy="500" r="118" fill="none" stroke="#c8683b" stroke-opacity=".55" stroke-width="3"/>
    <text x="500" y="466" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#7a3f28" letter-spacing="4">OLDIE &amp; GOLDIE</text>
    <text x="500" y="536" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="bold" fill="#3b251c">23</text>
    <text x="500" y="572" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" fill="#7a3f28" letter-spacing="4">SIDE A</text>
    <circle cx="500" cy="500" r="9" fill="#f8eddd"/>
  </g>

  <g transform="rotate(21 820 286)" filter="url(#shadow)">
    <circle cx="820" cy="286" r="58" fill="#2e6f68"/>
    <circle cx="820" cy="286" r="40" fill="#f2c6a0"/>
    <circle cx="820" cy="286" r="12" fill="#3b251c"/>
    <rect x="803" y="286" width="34" height="300" rx="17" fill="#f0d59c"/>
    <rect x="803" y="286" width="11" height="300" rx="6" fill="#fff8e8" opacity=".55"/>
    <rect x="798" y="574" width="44" height="62" rx="8" fill="#3b251c"/>
    <rect x="806" y="624" width="28" height="14" rx="4" fill="#c8683b"/>
  </g>

  <rect width="1000" height="1000" filter="url(#grain)" opacity=".55"/>
</svg>
