<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title">
  <title id="title">A wooden crate full of record sleeves</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d59c"/>
      <stop offset=".58" stop-color="#f2c6a0"/>
      <stop offset="1" stop-color="#e3a184"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b06a3f"/>
      <stop offset=".5" stop-color="#8d4c31"/>
      <stop offset="1" stop-color="#5b3425"/>
    </linearGradient>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf6ea"/>
      <stop offset=".6" stop-color="#f2c6a0"/>
      <stop offset="1" stop-color="#eeb6ab"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".87" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .14"/></feComponentTransfer>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#5b3425" flood-opacity=".4"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>
  <circle cx="810" cy="210" r="300" fill="#fff6df" opacity=".3"/>
  <circle cx="160" cy="860" r="280" fill="#c8683b" opacity=".1"/>
  <path d="M0 830c160-46 300-30 470 14s350 44 530 0v156H0Z" fill="#b06a3f" opacity=".18"/>

  <!-- sleeves in the crate -->
  <g filter="url(#shadow)">
    <g transform="rotate(-11 390 480)">
      <rect x="220" y="260" width="330" height="450" rx="5" fill="#2e6f68"/>
      <circle cx="385" cy="470" r="105" fill="#f0d59c" opacity=".9"/>
      <circle cx="385" cy="470" r="62" fill="#2e6f68"/>
      <text x="385" y="485" text-anchor="middle" font-family="Georgia, serif" font-size="46" font-weight="bold" fill="#f8eddd">23</text>
      <text x="385" y="330" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" fill="#f8eddd" letter-spacing="4">SIDE B</text>
    </g>
    <g transform="rotate(4 560 470)">
      <rect x="400" y="230" width="340" height="470" rx="5" fill="url(#sleeve)"/>
      <circle cx="570" cy="450" r="112" fill="#3b251c"/>
      <circle cx="570" cy="450" r="70" fill="#c8683b"/>
      <circle cx="570" cy="450" r="10" fill="#f8eddd"/>
      <text x="570" y="330" text-anchor="middle" font-family="'Courier New', monospace" font-size="17" fill="#7a3f28" letter-spacing="3">OLDIE &amp; GOLDIE</text>
      <text x="570" y="640" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-style="italic" fill="#3b251c">Hisham</text>
    </g>
    <g transform="rotate(15 690 500)">
      <rect x="610" y="280" width="300" height="430" rx="5" fill="#eeb6ab"/>
      <path d="M660 620c10-160 50-260 120-320 50 90 60 200 30 320Z" fill="#b23a48" opacity=".8"/>
      <text x="760" y="330" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#7a3f28" letter-spacing="3">GOLDIE</text>
    </g>
  </g>

  <!-- crate front -->
  <g filter="url(#shadow)">
    <rect x="130" y="640" width="740" height="260" rx="10" fill="url(#wood)"/>
    <rect x="150" y="665" width="700" height="34" rx="5" fill="#c9854f"/>
    <rect x="150" y="720" width="700" height="34" rx="5" fill="#c9854f"/>
    <rect x="150" y="775" width="700" height="34" rx="5" fill="#c9854f"/>
    <rect x="150" y="830" width="700" height="34" rx="5" fill="#c9854f"/>
    <rect x="132" y="640" width="52" height="260" rx="8" fill="#6d3a27"/>
    <rect x="816" y="640" width="52" height="260" rx="8" fill="#6d3a27"/>
    <circle cx="182" cy="700" r="6" fill="#3b251c"/>
    <circle cx="818" cy="700" r="6" fill="#3b251c"/>
    <circle cx="182" cy="840" r="6" fill="#3b251c"/>
    <circle cx="818" cy="840" r="6" fill="#3b251c"/>
    <rect x="460" y="770" width="80" height="58" rx="5" fill="#3b251c"/>
    <text x="500" y="797" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#f0d59c" letter-spacing="2">23</text>
  </g>

  <!-- fingers flipping a sleeve -->
  <g transform="translate(690 540)" filter="url(#shadow)">
    <path d="M0 70c-28-22-52-16-58 8-6 22 12 42 40 48l68 14c26 6 46-8 46-30 0-20-16-32-36-32H18Z" fill="#e8b48d"/>
    <path d="M22 62c-4-26 8-38 26-38 18 0 30 14 30 40v18H22Z" fill="#f2c6a0"/>
    <path d="M58 64c-2-28 10-40 28-38 16 2 26 18 22 42l-4 18H58Z" fill="#e8b48d"/>
  </g>

  <rect width="1000" height="1000" filter="url(#grain)" opacity=".5"/>
</svg>
