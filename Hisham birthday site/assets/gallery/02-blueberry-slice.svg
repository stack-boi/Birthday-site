<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title">
  <title id="title">A slice of blueberry and cherry cheesecake on a plate</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e6f68"/>
      <stop offset=".62" stop-color="#4b8b80"/>
      <stop offset="1" stop-color="#b6d1c8"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#e8d8bf"/>
    </linearGradient>
    <linearGradient id="cheese" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4d8"/>
      <stop offset=".55" stop-color="#f5dfb4"/>
      <stop offset="1" stop-color="#e9c88f"/>
    </linearGradient>
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9854f"/>
      <stop offset="1" stop-color="#8a4a30"/>
    </linearGradient>
    <radialGradient id="berry" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#8d6bb0"/>
      <stop offset=".65" stop-color="#5b3f7c"/>
      <stop offset="1" stop-color="#3d2a57"/>
    </radialGradient>
    <radialGradient id="cherry" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#df6a6f"/>
      <stop offset=".6" stop-color="#b23a48"/>
      <stop offset="1" stop-color="#7d1f2d"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .12"/></feComponentTransfer>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#173f3b" flood-opacity=".4"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>
  <circle cx="820" cy="160" r="230" fill="#f0d59c" opacity=".18"/>
  <circle cx="180" cy="840" r="260" fill="#f2c6a0" opacity=".12"/>

  <!-- gingham napkin -->
  <g transform="rotate(-7 210 780)">
    <rect x="40" y="670" width="300" height="250" rx="10" fill="#eeb6ab"/>
    <g stroke="#f8eddd" stroke-opacity=".45" stroke-width="14">
      <path d="M75 670v250M145 670v250M215 670v250M285 670v250"/>
      <path d="M40 720h300M40 790h300M40 860h300"/>
    </g>
  </g>

  <!-- plate -->
  <g filter="url(#shadow)">
    <ellipse cx="530" cy="710" rx="330" ry="112" fill="#173f3b" opacity=".22"/>
    <ellipse cx="520" cy="690" rx="330" ry="112" fill="url(#plate)"/>
    <ellipse cx="520" cy="690" rx="258" ry="82" fill="none" stroke="#c9a97f" stroke-opacity=".5" stroke-width="3"/>
  </g>

  <!-- cheesecake slice -->
  <g filter="url(#shadow)">
    <path d="M320 640 L710 520 L790 660 L430 790 Z" fill="url(#cheese)"/>
    <path d="M320 640 L430 790 L440 840 L326 690 Z" fill="url(#crust)"/>
    <path d="M430 790 L790 660 L800 706 L442 840 Z" fill="#b06a3f"/>
    <path d="M320 640 L710 520 L790 660 L430 790 Z" fill="none" stroke="#d8ac6e" stroke-width="4"/>
    <path d="M320 640 L710 520 L790 660" fill="none" stroke="#fff8e8" stroke-opacity=".7" stroke-width="8"/>
  </g>

  <!-- blueberry compote swirl -->
  <path d="M370 660c70-52 150-30 190-76 36-42 96-46 130-18 28 24 20 58-8 66-38 12-58-22-96-8-44 16-72 54-132 68-34 8-62 0-84-32Z" fill="#5b3f7c" opacity=".88"/>
  <g>
    <circle cx="395" cy="664" r="28" fill="url(#berry)"/>
    <circle cx="455" cy="636" r="24" fill="url(#berry)"/>
    <circle cx="516" cy="616" r="27" fill="url(#berry)"/>
    <circle cx="574" cy="590" r="23" fill="url(#berry)"/>
    <circle cx="630" cy="606" r="26" fill="url(#berry)"/>
    <circle cx="678" cy="584" r="21" fill="url(#berry)"/>
    <g fill="#f8eddd" opacity=".55">
      <circle cx="386" cy="654" r="6"/><circle cx="447" cy="628" r="5"/><circle cx="508" cy="606" r="6"/>
      <circle cx="566" cy="582" r="5"/><circle cx="622" cy="598" r="6"/><circle cx="671" cy="577" r="5"/>
    </g>
  </g>

  <!-- cherries -->
  <g>
    <circle cx="610" cy="530" r="44" fill="url(#cherry)"/>
    <circle cx="700" cy="512" r="37" fill="url(#cherry)"/>
    <circle cx="596" cy="518" r="12" fill="#fff8e8" opacity=".5"/>
    <circle cx="688" cy="502" r="10" fill="#fff8e8" opacity=".5"/>
    <path d="M613 488c6-48 26-78 60-98M700 476c-4-42-24-74-58-94" fill="none" stroke="#3f6b3c" stroke-width="8" stroke-linecap="round"/>
    <path d="M676 378c-16-22-10-46 8-58 8 22 4 42-8 58Z" fill="#5d8a4d"/>
  </g>

  <!-- fork -->
  <g transform="rotate(18 830 700)" filter="url(#shadow)">
    <rect x="818" y="520" width="16" height="280" rx="8" fill="#d9c8ad"/>
    <rect x="800" y="470" width="8" height="86" rx="4" fill="#d9c8ad"/>
    <rect x="815" y="470" width="8" height="86" rx="4" fill="#d9c8ad"/>
    <rect x="830" y="470" width="8" height="86" rx="4" fill="#d9c8ad"/>
    <rect x="845" y="470" width="8" height="86" rx="4" fill="#d9c8ad"/>
    <path d="M808 556h36v18h-36Z" fill="#c8b394"/>
  </g>

  <rect width="1000" height="1000" filter="url(#grain)" opacity=".5"/>
</svg>
