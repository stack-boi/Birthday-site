<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title">
  <title id="title">A pair of in-ear monitors with a braided cable</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8683b"/>
      <stop offset=".55" stop-color="#a9502f"/>
      <stop offset="1" stop-color="#6d3222"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#74a79c"/>
      <stop offset=".5" stop-color="#2e6f68"/>
      <stop offset="1" stop-color="#1d4a46"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8eddd"/>
      <stop offset="1" stop-color="#f2c6a0"/>
    </linearGradient>
    <radialGradient id="shine" cx=".3" cy=".2" r=".7">
      <stop offset="0" stop-color="#fff6df" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff6df" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".88" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .14"/></feComponentTransfer>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#2a1710" flood-opacity=".48"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>
  <circle cx="240" cy="180" r="300" fill="url(#shine)"/>
  <circle cx="820" cy="820" r="320" fill="#f0d59c" opacity=".1"/>
  <path d="M0 760c180-80 330-40 470 30s340 90 530 0v210H0Z" fill="#3b251c" opacity=".2"/>

  <!-- cable -->
  <g fill="none" stroke="#2a1710" stroke-linecap="round" filter="url(#shadow)">
    <path d="M262 558c-120 24-198 104-184 206 10 72 78 90 128 52 38-28 24-82-16-78-42 4-56 62-16 104 44 46 130 44 194-4" stroke-width="22"/>
    <path d="M730 566c112 30 176 112 156 206-16 74-86 86-132 44-34-32-16-84 24-76 40 8 48 64 6 100-46 40-128 30-186-20" stroke-width="22"/>
  </g>
  <g fill="none" stroke="#c9854f" stroke-width="3" stroke-dasharray="9 10" opacity=".7">
    <path d="M262 558c-120 24-198 104-184 206 10 72 78 90 128 52 38-28 24-82-16-78-42 4-56 62-16 104 44 46 130 44 194-4"/>
    <path d="M730 566c112 30 176 112 156 206-16 74-86 86-132 44-34-32-16-84 24-76 40 8 48 64 6 100-46 40-128 30-186-20"/>
  </g>

  <!-- left IEM -->
  <g transform="rotate(-14 300 430)" filter="url(#shadow)">
    <path d="M206 404c-16-96 50-178 142-186 84-8 138 44 140 118 2 76-50 144-126 158-70 12-146-20-156-90Z" fill="url(#shell)"/>
    <path d="M226 388c-10-68 38-128 108-136 62-8 106 30 110 88 4 56-36 108-94 118-54 10-116-16-124-70Z" fill="url(#face)" opacity=".96"/>
    <path d="M246 380c-4-48 28-92 78-100 46-6 80 20 84 62" fill="none" stroke="#c8683b" stroke-width="5" opacity=".65"/>
    <circle cx="330" cy="352" r="12" fill="#2e6f68"/>
    <path d="M456 468c42 10 66 34 64 66-2 32-28 50-58 44-24-6-34-28-20-42 12-12 32-6 34 10 2 18-18 28-32 18" fill="none" stroke="#3b251c" stroke-width="18" stroke-linecap="round"/>
    <circle cx="458" cy="470" r="20" fill="#f0d59c"/>
    <circle cx="458" cy="470" r="11" fill="#3b251c"/>
    <path d="M186 390c-34-10-62 4-74 32-10 24 2 48 24 54 24 6 44-10 42-30-2-16-20-22-30-10" fill="none" stroke="#3b251c" stroke-width="16" stroke-linecap="round"/>
    <text x="306" y="312" text-anchor="middle" font-family="'Courier New', monospace" font-size="30" fill="#7a3f28" letter-spacing="6">L</text>
  </g>

  <!-- right IEM -->
  <g transform="rotate(12 706 462)" filter="url(#shadow)">
    <path d="M806 440c18-96-44-180-136-192-84-10-140 40-144 114-4 76 46 146 122 162 70 14 148-16 158-84Z" fill="url(#shell)"/>
    <path d="M786 424c12-68-34-130-104-140-62-10-108 28-114 86-6 56 32 110 90 122 54 12 118-12 128-68Z" fill="url(#face)" opacity=".96"/>
    <path d="M766 416c6-48-24-94-74-104-46-8-82 16-88 58" fill="none" stroke="#c8683b" stroke-width="5" opacity=".65"/>
    <circle cx="684" cy="386" r="12" fill="#2e6f68"/>
    <path d="M556 506c-42 10-66 34-64 66 2 32 28 50 58 44 24-6 34-28 20-42-12-12-32-6-34 10-2 18 18 28 32 18" fill="none" stroke="#3b251c" stroke-width="18" stroke-linecap="round"/>
    <circle cx="554" cy="508" r="20" fill="#f0d59c"/>
    <circle cx="554" cy="508" r="11" fill="#3b251c"/>
    <path d="M826 424c34-10 62 4 74 32 10 24-2 48-24 54-24 6-44-10-42-30 2-16 20-22 30-10" fill="none" stroke="#3b251c" stroke-width="16" stroke-linecap="round"/>
    <text x="710" y="342" text-anchor="middle" font-family="'Courier New', monospace" font-size="30" fill="#7a3f28" letter-spacing="6">R</text>
  </g>

  <rect width="1000" height="1000" filter="url(#grain)" opacity=".5"/>
</svg>
